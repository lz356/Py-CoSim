name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests (EnergyPlus tests are skipped when EnergyPlus is absent)
        run: python -m pytest -q
      - name: Run examples that need no EnergyPlus
        run: |
          python examples/01_quickstart_no_energyplus/run.py --no-plot
          python examples/09_custom_component_ev/run.py --days 2
          python examples/11_messages_and_time/run.py --days 1
